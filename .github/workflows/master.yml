# CI pipeline for Maven compilation, MySQL connection testing,
# and Docker container verification.

name: Java CI & Container Verification

on:
  push:
  pull_request:

jobs:
  build:
    name: Application Pipeline Execution
    runs-on: ubuntu-22.04

    # Start MySQL for the integration test.
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: world
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: password

    steps:
      - name: Fetch source files
        uses: actions/checkout@v4

      - name: Initialize Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven

      # Load the World database schema and data.
      # Change this path to the actual SQL dump in your repository.
      - name: Import World database
        run: mysql -h 127.0.0.1 -P 3307 -u root -ppassword world < path/to/world.sql

      - name: Compile and package application
        run: mvn clean package

      - name: Verify generated JAR
        run: ls -lh target/*.jar

      # Test the Java database connection on the runner.
      - name: Test MySQL connection
        run: java -jar target/seMethods-1.0-SNAPSHOT.jar

      - name: Build Docker image
        run: docker build -t devopsimage .

      # The container must use the host gateway to reach MySQL.
      - name: Test Docker container
        run: |
          docker run --name devopscontainer \
            --add-host=host.docker.internal:host-gateway \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=3307 \
            -e DB_USER=root \
            -e DB_PASSWORD=password \
            devopsimage || {
              docker logs devopscontainer
              exit 1
            }

      - name: View container logs
        if: always()
        run: docker logs devopscontainer || true

      - name: Clean up container
        if: always()
        run: docker rm -f devopscontainer || true