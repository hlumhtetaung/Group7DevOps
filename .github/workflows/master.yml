# CI pipeline executing compilation, artifact verification,
# database connectivity check, and container testing via Maven and Docker.

name: Group 7 Java CI & Database Container Verification

# Trigger execution on every push event to the repo.
on:
  push:

jobs:
  build:
    name: Group 7 Assessment Pipeline Execution

    # Host job execution on an Ubuntu virtual environment.
    runs-on: ubuntu-22.04

    steps:

      # Fetch latest repository code.
      - name: Fetch source files from repository
        uses: actions/checkout@v4

      # Configure Java environment alongside Maven package caching.
      - name: Initialize OpenJDK environment
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Execute full compilation cycle to generate deployable executable archive.
      - name: Compile and package application (mvn clean package)
        run: mvn clean package

      # Confirm artifact creation in target directory.
      - name: Inspect built artifact in target directory
        run: ls -lh target/*.jar

      # Construct local container image using root Dockerfile.
      - name: Assemble application Docker image
        run: docker build -t devopsimage .

      # Use Docker Compose or spin up containers matching your service structure.
      - name: Spin up application and database services via Docker Compose
        run: docker compose up -d

      # Pause execution briefly to allow service startup and database initialization.
      - name: Delay for container bootstrap and DB readiness
        run: sleep 10

      # Check database connection and container health status.
      - name: Test and Verify Database Connection Success
        run: |
          echo "Checking database container health status..."
          docker inspect --format='{{json .State.Health.Status}}' group7-db || echo "Health check not configured, inspecting logs..."
          docker logs group7-db | grep -i "ready for connections" || true

      # Retrieve standard console output to confirm app startup state.
      - name: Fetch runtime container application output
        run: docker compose logs app

      # Gracefully shut down active containers post-test.
      - name: Teardown running containers and services
        run: docker compose down