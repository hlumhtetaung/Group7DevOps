# CI pipeline for Group 7: unit tests, integration tests + Codecov,
# JAR packaging, and Docker Compose check.

name: Group 7 Java CI & Database Container Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Run non-DB unit tests first so fast failures don't waste time spinning up MySQL
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Fetch source files from repository
        uses: actions/checkout@v4

      - name: Initialize OpenJDK environment
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn "-Dtest=!com.napier.group7.AppIntegrationTest" test

      - name: Print Surefire Unit Test Reports on Failure
        if: failure()
        run: cat target/surefire-reports/*.txt

  # Spin up MySQL on 3307 (matches AppIntegrationTest), run DB tests,
  # generate JaCoCo XML, and send it over to Codecov
  IntegrationTests:
    name: Integration Tests & Codecov
    runs-on: ubuntu-22.04
    needs: UnitTests

    steps:
      - name: Fetch source files from repository
        uses: actions/checkout@v4

      - name: Initialize OpenJDK environment
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL Database Container
        run: |
          # Load world.sql on first boot and expose 3307 for the integration test
          docker run -d --name group7-db \
            -e MYSQL_ROOT_PASSWORD=password \
            -p 3307:3306 \
            -v "${{ github.workspace }}/db/world.sql:/docker-entrypoint-initdb.d/world.sql" \
            mysql:8.4

      - name: Wait for Database Readiness
        run: |
          # Give MySQL up to ~60s to finish init before running tests
          for i in $(seq 1 30); do
            if docker exec group7-db mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run Integration Tests & Generate JaCoCo Report
        run: mvn -Dtest="com.napier.group7.AppIntegrationTest" test

      - name: Print Surefire Integration Test Reports on Failure
        if: failure()
        run: cat target/surefire-reports/*.txt

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Clean Up Standalone DB Container
        if: always()
        run: docker rm -f group7-db || true

  # Package the JAR and sanity-check the Docker Compose setup
  build:
    name: Group 7 Assessment Pipeline Execution
    runs-on: ubuntu-22.04
    needs: [UnitTests, IntegrationTests]

    steps:
      - name: Fetch source files from repository
        uses: actions/checkout@v4

      - name: Initialize OpenJDK environment
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Skip tests here since UnitTests and IntegrationTests already ran above
      - name: Compile and package application (mvn clean package -DskipTests)
        run: mvn clean package -DskipTests

      - name: Print Surefire Test Reports
        if: failure()
        run: cat target/surefire-reports/*.txt

      - name: Inspect built artifact in target directory
        run: ls -lh target/*.jar

      - name: Spin up application and database services via Docker Compose
        run: docker compose up -d

      - name: Delay for container bootstrap and DB readiness
        run: sleep 10

      - name: Test and Verify Database Connection Success
        run: |
          echo "Checking database container health status..."
          docker inspect --format='{{json .State.Health.Status}}' group7-db || echo "Health check not configured, inspecting logs..."
          docker logs group7-db | grep -i "ready for connections" || true

      - name: Fetch runtime container application output
        run: docker compose logs app

      - name: Teardown running containers and services
        if: always()
        run: docker compose down