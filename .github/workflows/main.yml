# GitHub Actions workflow for building and testing the project
# using Maven and Docker.

name: Build and Docker Test

# Run the workflow whenever code is pushed to the repository.
on:
  push:

jobs:
  build:
    name: Build and Test Project

    # Use an Ubuntu runner for the build.
    runs-on: ubuntu-22.04

    steps:

      # Get the project source code from GitHub.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java 26 and configure Maven dependency caching.
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Clean previous build files and create the project JAR.
      # The JAR should be self-contained so it can run independently.
      - name: Build self-contained JAR with Maven
        run: mvn clean package

      # Verify that the Maven build created a JAR file.
      - name: Check generated JAR
        run: ls -lh target/*.jar

      # Build the Docker image using the project's Dockerfile.
      - name: Build Docker image
        run: docker build -t devopsimage .

      # Start a container from the Docker image.
      - name: Run Docker container
        run: docker run --name devopscontainer -d devopsimage

      # Give the application a short amount of time to start.
      - name: Wait for application
        run: sleep 5

      # Display the application's output from the Docker container.
      # This helps verify that the application started correctly.
      - name: View application logs
        run: docker logs devopscontainer

      # Stop the container after the test has completed.
      - name: Stop Docker container
        run: docker stop devopscontainer
